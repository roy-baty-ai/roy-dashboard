<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>ROY — 観察画面</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
<header><p class="eyebrow">公開用の観察画面 · 日本時間</p><h1>ROY <span id="day">—</span></h1><p class="revenue" id="revenue">—</p><p>本業の累計収益</p><p id="updated">確認済みの状態を読み込み中…</p></header>
<section class="human"><h2>NEEDS HUMAN</h2><ul id="needsHuman"></ul></section>
<section><h2>NOW</h2><ul id="now"></ul></section>
<section><h2>WAITING</h2><ul id="waiting"></ul></section>
<section><h2>RECENT ACTIVITY</h2><ol id="recent"></ol></section>
<section><h2>BUSINESS CANDIDATES</h2><ul id="candidates"></ul></section>
<section><h2>BLOCKERS</h2><ul id="blockers"></ul></section>
<footer><p id="freshness">状態は手動で確認・更新します。公開だけでは状況は更新されません。</p><p>DAY 1：2026年10月1日（日本時間）。閲覧専用。</p></footer>
<noscript><p>状態の表示にはJavaScriptを有効にしてください。</p></noscript>
</main>
</body>
</html>
